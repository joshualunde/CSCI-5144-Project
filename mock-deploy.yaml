apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exchange-api
  template:
    metadata:
      labels:
        app: exchange-api
    spec:
      containers:
      - name: exchange-api
        image: team-jam-mock-exchange:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: WORK_FACTOR
          value: "12000"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exchange-api
spec:
  selector:
    app: exchange-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
